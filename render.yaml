# Blueprint do Render (fica na raiz: é onde o Render procura; cada serviço aponta a sua pasta em rootDir).
# Publica o proxy (docs/12-proxy.md) e o backend do Sistema 2 (docs/11). O frontend vai para a Vercel
# (frontend/vercel.json), não para o Render.
#
# Segredos usam `sync: false`: o Render pede o valor no painel e ele não fica no repositório.
# Os valores estão em scripts/<codename>_<timestamp>_<versao>/ (gerado por scripts/gerar-env.cjs):
# proxy.env para o suprimax-cotacao-proxy e backend.env para o suprimax-cotacao.
services:
  - type: web
    name: suprimax-cotacao-proxy
    runtime: node
    plan: free
    rootDir: proxy
    # --include=dev: o Render pode omitir devDependencies em produção, e o build precisa do tsc.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    autoDeployTrigger: commit # deploy a cada merge na main (docs/03, seção 3.2)
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ENV
        value: producao
      # PORT: não definir; o Render injeta.
      # Rate limit (docs/12, 12.4): por integrante (depois da autenticação) e teto por IP (antes dela).
      # 1200/min por integrante = 10 operadores simultâneos x ~1 ação/s x ~5 chamadas, com folga de 2x.
      # O backend inteiro sai de um IP, então o teto por IP (6000/min) fica bem acima: só contra abuso.
      - key: RATE_LIMIT_JANELA_SEGUNDOS
        value: "60"
      - key: RATE_LIMIT_INTEGRANTE_MAXIMO
        value: "1200"
      - key: RATE_LIMIT_IP_MAXIMO
        value: "6000"
      - key: DATABASE_URL # pooler, Transaction, porta 6543
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PROXY_ADMIN_KEY
        sync: false
      - key: JWT_SIGNING_SECRET
        sync: false

  - type: web
    name: suprimax-cotacao
    runtime: node
    plan: free
    rootDir: backend
    # O módulo de cálculo (backend/services/calculo) é compilado junto: o tsc usa rootDir ".".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /saude
    autoDeployTrigger: commit
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ENV
        value: producao
      # PORT: não definir; o Render injeta.
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY # um balanceador do Render à frente (identifica o IP do cliente)
        value: "1"
      - key: SESSAO_INATIVIDADE_MINUTOS
        value: "30"
      # Em produção o backend recusa localhost e valores de exemplo nestas quatro.
      - key: CORS_ORIGENS # URL do frontend na Vercel, sem barra final
        sync: false
      - key: PROXY_URL # URL pública do suprimax-cotacao-proxy neste Render
        sync: false
      - key: PROXY_SERVICE_ID
        sync: false
      - key: PROXY_SERVICE_TOKEN
        sync: false
      # Jobs agendados (UC20). JOBS_AGENDADOS_* ligam o agendador dentro do processo; JOBS_TOKEN é o
      # segredo do cron externo que chama POST /jobs/executar (Authorization: Bearer). Opcionais: sem
      # JOBS_TOKEN, a via por token fica desligada (backend/src/config.ts).
      - key: JOBS_AGENDADOS_HABILITADOS
        value: "false"
      - key: JOBS_AGENDADOS_INTERVALO_MINUTOS
        value: "60"
      - key: JOBS_TOKEN
        sync: false
      # Dados da empresa emissora do orçamento (PDF, UC19). Obrigatórios fora de dev: sem elas o
      # backend não sobe (backend/src/config.ts). Use os dados reais; valores de exemplo são recusados.
      - key: EMPRESA_RAZAO_SOCIAL
        sync: false
      - key: EMPRESA_ENDERECO
        sync: false
      - key: EMPRESA_TELEFONE
        sync: false
      - key: EMPRESA_CNPJ
        sync: false
      - key: EMPRESA_INSCRICAO_ESTADUAL
        sync: false
      - key: EMPRESA_PIX
        sync: false
      - key: EMPRESA_DADOS_BANCARIOS
        sync: false
      # E-mail de definição/recuperação de senha (UC13, UC25), via Resend (backend/src/config.ts).
      # Sem RESEND_API_KEY o backend não envia nada (só log); com ela, as duas seguintes são obrigatórias.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE # remetente verificado no Resend
        sync: false
      - key: FRONTEND_URL # URL do frontend na Vercel, sem barra final (base do link de redefinição)
        sync: false
